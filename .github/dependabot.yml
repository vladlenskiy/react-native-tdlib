version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "weekly"
    groups:
      example-dependencies:
        patterns:
          - "*"
    # example/ stays on React Native 0.70 until its native projects are
    # migrated by hand. These three packages track the RN version with 0.x
    # numbers, so the semver-major rule below does not cover them.
    ignore:
      - dependency-name: "react-native"
      - dependency-name: "metro-react-native-babel-preset"
      - dependency-name: "@types/react-native"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
