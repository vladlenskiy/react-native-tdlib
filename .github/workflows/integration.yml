name: Fresh app check

# Installs the packed library into a newly generated React Native app and
# checks, on both platforms, that it autolinks, builds in Release, launches,
# and that the native TDLib library answers a request. getTextEntities runs
# through td_json_client_execute and needs no Telegram login.
#
# With the TDLIB_TEST_API_ID / TDLIB_TEST_API_HASH secrets set, the app also
# logs in to Telegram's test DC with a throwaway 99966XYYYY number, creates
# a supergroup and checks that getSupergroup returns the same id. The api_id
# must be one the test DC recognizes. Without the secrets (for example on PRs
# from forks) that part reports auth=SKIP.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'react-native.config.js'
      - 'react-native-tdlib.podspec'
      - '.github/integration/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'react-native.config.js'
      - 'react-native-tdlib.podspec'
      - '.github/integration/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  RN_VERSION: 0.88.1
  RN_CLI_VERSION: 21.0.0
  APP_DIR: ${{ github.workspace }}/../TdlibCheck

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pack the library
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create a React Native ${{ env.RN_VERSION }} app
        working-directory: ${{ github.workspace }}/..
        run: |
          npx --yes @react-native-community/cli@"$RN_CLI_VERSION" init TdlibCheck \
            --version "$RN_VERSION" --skip-git-init --install-pods false --pm npm

      - name: Install the packed library
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund "$RUNNER_TEMP"/react-native-tdlib-*.tgz
          cp "$GITHUB_WORKSPACE/.github/integration/App.tsx" App.tsx

      - name: Write test DC credentials
        working-directory: ${{ env.APP_DIR }}
        env:
          TDLIB_API_ID: ${{ secrets.TDLIB_TEST_API_ID }}
          TDLIB_API_HASH: ${{ secrets.TDLIB_TEST_API_HASH }}
        run: >-
          node -e "require('fs').writeFileSync('tdlib-credentials.json',
          JSON.stringify({api_id: process.env.TDLIB_API_ID || '', api_hash: process.env.TDLIB_API_HASH || ''}))"

      - name: Check autolinking
        working-directory: ${{ env.APP_DIR }}
        run: node "$GITHUB_WORKSPACE/.github/integration/assert-config.js"

      - name: Build the release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/integration/run-android.sh "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk"

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pack the library
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create a React Native ${{ env.RN_VERSION }} app
        working-directory: ${{ github.workspace }}/..
        run: |
          npx --yes @react-native-community/cli@"$RN_CLI_VERSION" init TdlibCheck \
            --version "$RN_VERSION" --skip-git-init --install-pods false --pm npm

      - name: Install the packed library
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund "$RUNNER_TEMP"/react-native-tdlib-*.tgz
          cp "$GITHUB_WORKSPACE/.github/integration/App.tsx" App.tsx

      - name: Write test DC credentials
        working-directory: ${{ env.APP_DIR }}
        env:
          TDLIB_API_ID: ${{ secrets.TDLIB_TEST_API_ID }}
          TDLIB_API_HASH: ${{ secrets.TDLIB_TEST_API_HASH }}
        run: >-
          node -e "require('fs').writeFileSync('tdlib-credentials.json',
          JSON.stringify({api_id: process.env.TDLIB_API_ID || '', api_hash: process.env.TDLIB_API_HASH || ''}))"

      - name: Check autolinking
        working-directory: ${{ env.APP_DIR }}
        run: node "$GITHUB_WORKSPACE/.github/integration/assert-config.js"

      - name: Install pods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install

      - name: Build Release for the simulator
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          xcodebuild -workspace TdlibCheck.xcworkspace -scheme TdlibCheck \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build

      - name: Launch on a simulator
        run: bash .github/integration/run-ios.sh "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/TdlibCheck.app"
